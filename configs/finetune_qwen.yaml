# M2 — Qwen2.5-1.5B-Instruct QLoRA via TRL SFTTrainer (§6).
# quantize_4bit needs CUDA + bitsandbytes (make setup-cuda); on CPU-only
# hardware set model.base to Qwen/Qwen2.5-0.5B-Instruct and quantize_4bit
# to false (the documented §2 degradation; see configs/ablations/ for the
# ready-made 0.5B cell).
seed: 13
name: m2_qwen2.5_1.5b
system: finetune_causal

data:
  dataset: data/processed/dataset.jsonl
  train_split: train
  val_split: val
  eval_split: test

model:
  base: Qwen/Qwen2.5-1.5B-Instruct
  quantize_4bit: true
  max_seq_tokens: 640
  system_prompt: "You are a live cricket commentator. Describe this ball."

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  learning_rate: 2.0e-4
  epochs: 3
  batch_size: 4
  gradient_accumulation: 4
  early_stopping_patience: 2
  eval_every_steps: 200
  max_steps: -1

decoding:
  strategy: sample
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 96

eval_config: configs/eval.yaml
