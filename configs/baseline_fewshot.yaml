# B2 — few-shot prompted LLM (§6). FRONTIER_API=none in this project, so the
# default backend is a local HF instruct model. The 7B config is for CUDA
# machines; on CPU-only hardware Qwen2.5-1.5B-Instruct is the documented
# degradation (PLAN.md R2). Requires `make setup-full` + huggingface access.
seed: 13
name: b2_fewshot
system: fewshot

data:
  dataset: data/processed/dataset.jsonl
  split: test

generator:
  backend: hf_local          # hf_local | anthropic | openai
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  # model_name: Qwen/Qwen2.5-7B-Instruct   # CUDA machines, 4-bit
  load_in_4bit: false
  n_shots: 8
  max_new_tokens: 60
  # The prompt lives here, not in code (§6). {examples} is filled with n_shots
  # linearized-input -> commentary pairs covering outcome types; {input} is the
  # linearized ball.
  system_prompt: >-
    You are a live cricket commentator. Given a structured description of one
    delivery, write one or two vivid English sentences of commentary. Mention
    only facts present in the input. Do not invent players, scores, or events.
  prompt_template: |
    {examples}
    Input: {input}
    Commentary:
  example_selection: fixed_seeded   # 8 examples drawn once per run from train split

decoding:
  strategy: sample
  temperature: 0.7
  top_p: 0.9

eval_config: configs/eval.yaml
