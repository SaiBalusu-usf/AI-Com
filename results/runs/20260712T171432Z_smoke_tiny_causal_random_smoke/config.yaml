experiment:
  seed: 13
  name: smoke_tiny_causal_random
  system: finetune_causal
  data:
    dataset: data/processed/dataset.jsonl
    train_split: train
    val_split: val
    eval_split: test
  model:
    base: data/processed/tiny_random/causal
    quantize_4bit: false
    max_seq_tokens: 256
    system_prompt: You are a live cricket commentator. Describe this ball.
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  train:
    learning_rate: 0.0002
    epochs: 3
    batch_size: 8
    gradient_accumulation: 1
    early_stopping_patience: 2
    eval_every_steps: 25
    max_steps: -1
  decoding:
    strategy: greedy
    temperature: 0.7
    top_p: 0.9
    max_new_tokens: 32
  eval_config: configs/eval.yaml
  _config_path: configs/smoke/tiny_causal.yaml
